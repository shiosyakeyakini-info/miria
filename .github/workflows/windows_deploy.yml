name: デプロイ(windows)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build_for_windows:
    name: Windows用ビルド
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Flutter version from .fvmrc
        run:  echo "FLUTTER_FVM_VERSION=$(jq -r .flutter .fvmrc)" >> $env:GITHUB_ENV

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_FVM_VERSION }}
          cache: true

      - name: Flutter pub get
        run: |
          git config --system core.longpaths true
          flutter pub get

      # AiScript 処理系は rust/ の cargo ビルドとして入る。native assets は
      # 既定で無効なので有効化しておかないと、DLL が同梱されない
      - name: Update Rust
        run: rustup update

      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Get App Version
        run:  |
          echo "version=$(flutter pub run cider version)" >> $env:GITHUB_ENV
          echo "builddir=$(pwd)" >> $env:GITHUB_ENV

      - name: Build for Windows
        run: |
          flutter build windows --release

      # main は開発版を指しており、6.5 で ChineseSimplified が公式言語に昇格した際に
      # Unofficial/ から消えて 404 になった。curl が 404 本文をそのまま .isl として
      # 保存してしまうので、タグで固定した上で --fail で落とす。
      - name: Get translation files for Inno Setup
        run: |
          curl -fL -o ${{ env.builddir }}\ChineseSimplified.isl https://raw.githubusercontent.com/jrsoftware/issrc/is-6_4_3/Files/Languages/Unofficial/ChineseSimplified.isl

      - name: Copy DLL
        run: |
          cp C:\Windows\System32\msvcp140.dll build\windows\x64\runner\Release\
          cp C:\Windows\System32\vcruntime140.dll build\windows\x64\runner\Release\
          cp C:\Windows\System32\vcruntime140_1.dll build\windows\x64\runner\Release\

      - name: Compile .ISS to .EXE Installer
        run: iscc windows/innosetup.iss /dMyAppVersion="${{ env.version }}" /dMyWorkDir="${{ env.builddir }}" /Qp

      - name: Rename .EXE Installer
        run:  mv miria-installer.exe miria-installer_${env:version}_x64.exe

      - name: Compress files
        run: |
          ren build\windows\x64\runner\Release Miria
          Compress-Archive -Path build\windows\x64\runner\Miria -DestinationPath miria_${env:version}_windows-x64.zip -Force

      - name: Create tag and release note
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v${env:version}  miria_${env:version}_windows-x64.zip miria-installer_${env:version}_x64.exe
